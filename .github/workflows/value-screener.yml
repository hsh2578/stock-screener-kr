# =============================================================================
# 가치 스크리너 - 주간 자동 업데이트
# Last updated: 2026-02-05
# =============================================================================
#
# 이 워크플로우는:
#   1. 매주 토요일 12:00 KST에 전체 재무데이터 크롤링
#      (매출성장률, 영업이익률, EPS성장, 순이익 등 분기 데이터)
#   2. 저평가 우량주 스크리닝
#
# 참고:
#   - PER/PBR은 deploy.yml에서 평일 매일 경량 업데이트
#   - 60주선 우량주도 deploy.yml에서 평일 매일 업데이트
# =============================================================================

name: Weekly Value Stock Screener

on:
  # 매주 토요일 12:00 KST (UTC 03:00)
  schedule:
    - cron: '0 3 * * 6'  # Saturday 12:00 KST

  # 수동 실행 가능
  workflow_dispatch:

# 권한 설정
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: 'value-screener'
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHON_VERSION: '3.11'

jobs:
  collect-value-stocks:
    name: 📊 재무데이터 크롤링 + 저평가 우량주
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 디렉토리 생성
        run: |
          mkdir -p data

      - name: 🚀 저평가 우량주 스크리너 실행 (TTM)
        run: |
          echo "=========================================="
          echo "저평가 우량주 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python test_value_screener.py
          echo "=========================================="
          echo "저평가 우량주 스크리너 완료"
          echo "=========================================="

      - name: 🔍 변경 사항 확인
        id: check_changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 파일 없음"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "변경된 파일:"
            git diff --staged --name-only
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 변경 사항 커밋 및 푸시
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COMMIT_DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          git commit -m "📈 재무데이터 + 저평가 우량주 업데이트: ${COMMIT_DATE}"
          git pull --rebase origin main
          git push

      - name: 📋 실행 결과 요약
        if: always()
        run: |
          echo "=========================================="
          echo "📁 data 폴더 파일:"
          ls -lh data/ 2>/dev/null || echo "  (파일 없음)"
          echo ""
          if [ -f "data/value_stocks.json" ]; then
            echo "📊 저평가 우량주 결과:"
            python -c "import json; d=json.load(open('data/value_stocks.json')); print(f\"  총 {d['meta']['total_count']}개 종목\")"
          fi
          if [ -f "data/financial_data.json" ]; then
            echo "📊 재무데이터:"
            python -c "import json; d=json.load(open('data/financial_data.json')); print(f\"  총 {d['meta']['total_count']}개 종목\")"
          fi
          echo "=========================================="
