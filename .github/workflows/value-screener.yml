# =============================================================================
# 퀀트 스크리너 - 매일 20:00 KST 통합 실행
# Last updated: 2026-02-16
# =============================================================================
#
# 이 워크플로우는:
#   1. FnGuide 재무데이터 1회 공유 수집 (collect_quant_data.py)
#   2. 저평가 우량주 (TTM 재무데이터)
#   3. 마법공식 (이익수익률 + 투하자본수익률)
#   4. 멀티팩터 (Quality + Value + Momentum)
#   5. 60주선 우량주 (60주선 이격도 + 재무)
#
# FnGuide 데이터를 1회 수집 → pickle 캐시 → 4개 스크리너가 공유
# data/ 커밋 → push → deploy.yml 자동 트리거 → Pages 재배포
# =============================================================================

name: Daily Quant Screeners

on:
  # 매일 평일 20:00 KST (UTC 11:00)
  schedule:
    - cron: '0 11 * * 1-5'  # 평일 20:00 KST

  # 수동 실행 가능
  workflow_dispatch:

# 권한 설정
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: 'quant-screeners'
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHON_VERSION: '3.11'

jobs:
  run-quant-screeners:
    name: 📊 퀀트 스크리너 통합 실행
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 디렉토리 생성
        run: |
          mkdir -p data
          mkdir -p .cache

      - name: 💾 OHLCV 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: stock-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-data-${{ runner.os }}-

      - name: 📊 FnGuide 재무데이터 공유 수집
        run: |
          echo "=========================================="
          echo "FnGuide 데이터 수집 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python collect_quant_data.py
          echo "=========================================="
          echo "FnGuide 데이터 수집 완료"
          echo "=========================================="

      - name: 🚀 저평가 우량주 스크리너 실행 (TTM)
        run: |
          echo "=========================================="
          echo "저평가 우량주 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python test_value_screener.py
          echo "=========================================="
          echo "저평가 우량주 스크리너 완료"
          echo "=========================================="

      - name: 🧙 마법공식 스크리너 실행
        run: |
          echo "=========================================="
          echo "마법공식 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python magic_formula.py
          echo "=========================================="
          echo "마법공식 스크리너 완료"
          echo "=========================================="

      - name: 📊 멀티팩터 스크리너 실행
        run: |
          echo "=========================================="
          echo "멀티팩터 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python multi_factor.py
          echo "=========================================="
          echo "멀티팩터 스크리너 완료"
          echo "=========================================="

      - name: 📈 60주선 우량주 스크리너 실행
        run: |
          echo "=========================================="
          echo "60주선 우량주 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python ma60w_quality.py
          echo "=========================================="
          echo "60주선 우량주 스크리너 완료"
          echo "=========================================="

      - name: 🏛️ 대가 스크리너 실행 (Buffett/Ackman/Lynch/Graham)
        run: |
          echo "=========================================="
          echo "대가 스크리너 시작: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          python guru_screeners.py
          echo "=========================================="
          echo "대가 스크리너 완료"
          echo "=========================================="

      - name: 🔍 변경 사항 확인
        id: check_changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 파일 없음"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "변경된 파일:"
            git diff --staged --name-only
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 변경 사항 커밋 및 푸시
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COMMIT_DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          git commit -m "📊 퀀트 스크리너 업데이트: ${COMMIT_DATE}"
          git pull --rebase origin main
          git push

      - name: 📋 실행 결과 요약
        if: always()
        run: |
          echo "=========================================="
          echo "📁 data 폴더 파일:"
          ls -lh data/ 2>/dev/null || echo "  (파일 없음)"
          echo ""
          for f in value_stocks.json magic_formula.json multi_factor.json ma60w_quality.json buffett.json ackman.json lynch.json graham.json; do
            if [ -f "data/$f" ]; then
              echo "📊 $f:"
              python -c "
          import json
          d=json.load(open('data/$f'))
          meta=d.get('meta',{})
          count=meta.get('totalCount', meta.get('total_count', len(d.get('data',[]))))
          print(f'  총 {count}개 종목')
          "
            fi
          done
          echo "=========================================="
