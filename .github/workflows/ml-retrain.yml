# =============================================================================
# ML 모델 재학습 자동화
# Last updated: 2026-02-03
# =============================================================================
#
# 이 워크플로우는:
#   1. 매월 1일 03:00 KST에 최신 데이터로 ML 모델을 재학습
#   2. 52주 신고가 모델 + 박스권 돌파 모델 학습
#   3. 학습된 모델을 저장소에 커밋
#
# =============================================================================

name: Monthly ML Model Retrain

on:
  # 매월 1일 03:00 KST (UTC 18:00 전날)
  schedule:
    - cron: '0 18 1 * *'  # 매월 1일 03:00 KST

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      force_data_collection:
        description: '훈련 데이터 새로 수집 (캐시 무시)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 권한 설정
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: 'ml-retrain'
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHON_VERSION: '3.11'

jobs:
  retrain-models:
    name: 🤖 ML 모델 재학습
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 최대 2시간

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xgboost  # 박스권 돌파 모델용

      - name: 📁 디렉토리 생성
        run: |
          mkdir -p ml/data
          mkdir -p ml/models/52w_high
          mkdir -p ml/.cache

      # =========================================================================
      # 52주 신고가 모델
      # =========================================================================
      - name: 📊 52주 신고가 - 훈련 데이터 수집
        if: github.event.inputs.force_data_collection == 'true' || !hashFiles('ml/data/training_data_v2.csv')
        run: |
          echo "=========================================="
          echo "52주 신고가 훈련 데이터 수집 시작"
          echo "=========================================="
          cd ml/src
          python collect_training_data.py
          # training_data.csv -> training_data_v2.csv로 복사
          if [ -f "../data/training_data.csv" ]; then
            cp ../data/training_data.csv ../data/training_data_v2.csv
          fi

      - name: 🧠 52주 신고가 - 모델 학습
        run: |
          echo "=========================================="
          echo "52주 신고가 모델 학습 시작"
          echo "=========================================="
          cd ml/src
          python final_model.py

      # =========================================================================
      # 박스권 돌파 모델
      # =========================================================================
      - name: 📊 박스권 돌파 - 훈련 데이터 수집
        if: github.event.inputs.force_data_collection == 'true' || !hashFiles('ml/data/box_breakout_history.csv')
        run: |
          echo "=========================================="
          echo "박스권 돌파 훈련 데이터 수집 시작"
          echo "=========================================="
          python collect_box_breakout_history.py
          # 수집된 데이터를 ml/data로 복사
          if [ -f "data/box_breakout_history.csv" ]; then
            cp data/box_breakout_history.csv ml/data/box_breakout_history.csv
            echo "훈련 데이터 복사 완료"
          fi

      - name: 📊 박스권 돌파 - 훈련 데이터 확인
        id: check_box_data
        run: |
          if [ -f "ml/data/box_breakout_history.csv" ]; then
            echo "훈련 데이터 존재: ml/data/box_breakout_history.csv"
            echo "has_data=true" >> $GITHUB_OUTPUT
            wc -l ml/data/box_breakout_history.csv
          else
            echo "훈련 데이터 없음 - 박스권 돌파 모델 학습 건너뜀"
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

      - name: 🧠 박스권 돌파 - 모델 학습
        if: steps.check_box_data.outputs.has_data == 'true'
        run: |
          echo "=========================================="
          echo "박스권 돌파 모델 학습 시작"
          echo "=========================================="
          cd ml
          python train_final_box_breakout_model.py

      # =========================================================================
      # 결과 저장
      # =========================================================================
      - name: 🔍 변경 사항 확인
        id: check_changes
        run: |
          git add ml/models/ ml/data/
          if git diff --staged --quiet; then
            echo "변경된 파일 없음"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "변경된 파일:"
            git diff --staged --name-only
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 모델 커밋 및 푸시
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COMMIT_DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          git commit -m "🤖 ML 모델 재학습: ${COMMIT_DATE}

          - 52주 신고가 모델 업데이트
          - 박스권 돌파 모델 업데이트
          - 최신 주가 데이터 반영"
          git push

      - name: 📋 학습 결과 요약
        if: always()
        run: |
          echo "=========================================="
          echo "📁 ML 모델 파일:"
          echo "=========================================="
          echo ""
          echo "[52주 신고가 모델]"
          ls -lh ml/models/52w_high/ 2>/dev/null || echo "  (파일 없음)"
          echo ""
          echo "[박스권 돌파 모델]"
          ls -lh ml/models/*.joblib ml/models/*.json 2>/dev/null || echo "  (파일 없음)"
          echo ""
          echo "=========================================="
          echo "📊 훈련 데이터:"
          echo "=========================================="
          if [ -f "ml/data/training_data_v2.csv" ]; then
            echo "52주 신고가: $(wc -l < ml/data/training_data_v2.csv) 샘플"
          fi
          if [ -f "ml/data/box_breakout_history.csv" ]; then
            echo "박스권 돌파: $(wc -l < ml/data/box_breakout_history.csv) 샘플"
          fi
          echo "=========================================="
